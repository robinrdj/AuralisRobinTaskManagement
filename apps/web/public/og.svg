<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Auralis — a real-time task board">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d26"/>
      <stop offset="100%" stop-color="#252a38"/>
    </linearGradient>
    <radialGradient id="orb" cx="38%" cy="34%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#8b7cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d5ce7" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Auri, at the scale the favicon uses. -->
  <circle cx="150" cy="150" r="54" fill="#6d5ce7" opacity="0.16"/>
  <circle cx="150" cy="150" r="34" fill="url(#orb)"/>
  <circle cx="138" cy="138" r="9" fill="#ffffff" opacity="0.75"/>

  <text x="150" y="330" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="700" fill="#f5f6fa">
    Auralis
  </text>
  <text x="150" y="404" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="400" fill="#a8adbd">
    A task board that keeps up with the room
  </text>

  <!-- Four columns, echoing the board. -->
  <g opacity="0.9">
    <rect x="150" y="470" width="200" height="10" rx="5" fill="#3284d0"/>
    <rect x="370" y="470" width="200" height="10" rx="5" fill="#d37300"/>
    <rect x="590" y="470" width="200" height="10" rx="5" fill="#a853ad"/>
    <rect x="810" y="470" width="200" height="10" rx="5" fill="#009d82"/>
  </g>

  <text x="150" y="545" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#8b90a0">
    React · Hono · PostgreSQL · 260 tests
  </text>
</svg>
