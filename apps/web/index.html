<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auralis — Task Board</title>
    <meta
      name="description"
      content="A real-time task board with drag-and-drop, analytics and a guided first run."
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#6d5ce7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a24" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="Auralis — Task Board" />
    <meta
      property="og:description"
      content="A real-time task board with drag-and-drop, analytics and a guided first run."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a light flash.
      (function () {
        try {
          var stored = localStorage.getItem("auralis:theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* Private mode: fall back to the system preference. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
